name: CI
run-name: CI ${{ github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  windows_state_writer_lock:
    name: Windows lock (Node ${{ matrix.node }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Probe file identity
        run: npm run check:windows-file-identity

      - name: Verify state-writer lock
        run: npm run check:lossless-checkpoints

      - name: Verify idempotent install
        run: npm run check:windows-install-smoke

  validate:
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run build
          npm run check
          npm run check:adapters
          npm run check:tokens
          npm run check:artifacts
          npm pack --dry-run

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error title=Version already released::GitHub Release $TAG already exists. Bump package.json before merging to main."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error title=Tag already exists::Git tag $TAG already exists. Bump package.json before merging to main."
            exit 1
          fi

          if npm view "kyro-ai@$VERSION" version >/dev/null 2>&1; then
            echo "::error title=Version already published::kyro-ai@$VERSION already exists on npm. Bump package.json before merging to main."
            exit 1
          fi

  create_tag:
    needs: [validate, windows_state_writer_lock]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Create and push tag
        run: |
          git tag ${{ needs.validate.outputs.version_tag }}
          git push origin ${{ needs.validate.outputs.version_tag }}

  publish:
    needs: [validate, create_tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Rollback tag on failure
        if: failure()
        run: |
          git push --delete origin ${{ needs.validate.outputs.version_tag }} 2>/dev/null || true
          git tag -d ${{ needs.validate.outputs.version_tag }} 2>/dev/null || true

  create_release:
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.version_tag }}
          generate_release_notes: true
